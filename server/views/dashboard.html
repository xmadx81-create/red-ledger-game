<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>대시보드 | 헌혈의 집</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/auth.css" />
    <script type="module" src="/assets/dashboard.js"></script>
  </head>
  <body class="dashboard-body">
    <!-- 이중 중괄호로 감싼 name·email 자리는 서버(routes/pages.js)가 HTML 이스케이프 후 채운다. -->
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="/dashboard"><span class="brand-mark" aria-hidden="true"></span>헌혈의 집</a>
        <div class="account">
          <span class="account-name"><strong>{{name}}</strong>님</span>
          <button type="button" id="logout-button" class="logout-button">
            <span class="spinner" aria-hidden="true"></span>
            <span class="submit-label">로그아웃</span>
          </button>
        </div>
      </div>
    </header>

    <main class="dashboard">
      <div id="logout-alert" class="form-alert" role="alert"></div>
      <p id="logout-status" class="sr-only" role="status"></p>

      <section class="welcome" aria-labelledby="welcome-title">
        <h1 id="welcome-title">{{name}}님, 환영합니다!</h1>
        <p>헌혈의 집에 로그인되었습니다. 오늘도 따뜻한 하루 보내세요.</p>
        <p class="account-email">로그인 계정: {{email}}</p>
      </section>

      <!-- ── 향후 홈페이지 기능 영역 ─────────────────────────────────────────
           아래 카드를 실제 기능 링크로 바꾸거나 섹션을 추가해 확장한다. -->
      <section class="feature-area" aria-labelledby="feature-title">
        <h2 id="feature-title">바로가기</h2>
        <ul class="feature-grid">
          <li class="feature-card">
            <h3>내 카드 컬렉션</h3>
            <p>모은 혈맹 카드를 한눈에 확인하는 공간입니다.</p>
            <span class="badge">준비 중</span>
          </li>
          <li class="feature-card">
            <h3>공지사항</h3>
            <p>업데이트와 이벤트 소식을 전해 드립니다.</p>
            <span class="badge">준비 중</span>
          </li>
          <li class="feature-card">
            <h3>내 정보 관리</h3>
            <p>이름과 비밀번호를 변경하는 공간입니다.</p>
            <span class="badge">준비 중</span>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
